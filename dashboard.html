<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaki AI Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<style>
:root{
    --bg:#020b18;
    --bg2:#061426;
    --sidebar:#071426;
    --panel:#08182b;
    --panel2:#0b1d33;
    --panel3:#0e2340;
    --border:#173452;
    --border2:#214768;
    --text:#f2f7ff;
    --muted:#8da2bd;
    --blue:#3298ff;
    --blue2:#1677dc;
    --cyan:#1bd6ff;
    --green:#2bd598;
    --yellow:#f6c453;
    --red:#ff667f;
    --shadow:0 18px 45px rgba(0,0,0,.26);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
    background:
        radial-gradient(circle at 78% 3%,rgba(40,144,255,.07),transparent 26%),
        linear-gradient(180deg,#020a14 0%,#061326 55%,#04101e 100%);
    color:var(--text);
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.app{min-height:100vh;display:flex}

/* SIDEBAR */
.sidebar{
    width:228px;
    position:fixed;
    left:0;top:0;bottom:0;
    background:linear-gradient(180deg,#071427 0%,#061222 100%);
    border-right:1px solid #17304a;
    display:flex;
    flex-direction:column;
    z-index:30;
}
.brand{
    min-height:72px;
    padding:0 20px;
    display:flex;
    align-items:center;
    border-bottom:1px solid #152c45;
}
.brand-mark{
    width:30px;height:30px;
    display:grid;place-items:center;
    margin-right:8px;
    font-size:21px;
}
.brand-text{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
    color:#a88fff;
}
.nav{
    padding:17px 10px;
}
.nav-title{
    padding:0 13px 8px;
    text-transform:uppercase;
    font-size:9px;
    letter-spacing:1.2px;
    color:#647b95;
}
.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#93a8c0;
    text-align:left;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:5px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    font-weight:650;
    transition:.15s ease;
}
.nav-btn:hover{background:#10233d;color:#e8f1ff}
.nav-btn.active{
    background:#132b4b;
    color:#ffffff;
    box-shadow:inset 3px 0 0 #20b6ff;
}
.nav-icon{width:19px;text-align:center;font-size:15px}
.sidebar-spacer{flex:1}
.user-card{
    margin:10px;
    padding:11px;
    border:1px solid #1b3b5d;
    border-radius:11px;
    background:#081a2e;
}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,#314f88,#162a4b);
    border:1px solid #31517c;
    display:grid;place-items:center;
    color:#cfe3ff;font-weight:800;font-size:12px;
}
.user-name{font-size:12px;font-weight:800}
.user-email{font-size:10px;color:#788fa9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}
.logout{
    width:100%;
    margin-top:10px;
    padding:9px;
    border-radius:9px;
    border:1px solid #214463;
    background:#0a1e33;
    color:#ff7b9b;
    font-weight:700;
    font-size:12px;
}

/* MAIN */
.main{
    margin-left:228px;
    min-height:100vh;
    width:calc(100% - 228px);
}
.topbar{
    height:72px;
    padding:0 28px;
    border-bottom:1px solid #10273f;
    background:rgba(4,14,27,.72);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.page-title{
    font-size:18px;
    font-weight:800;
}
.page-subtitle{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{
    border:1px solid #214663;
    background:#0b1f35;
    color:#d7e6f9;
    padding:9px 13px;
    border-radius:8px;
    font-size:11px;
    font-weight:750;
}
.btn:hover{filter:brightness(1.08)}
.btn.primary{
    border-color:#2386df;
    color:white;
    background:linear-gradient(135deg,#1975da,#329cff);
}
.content{
    padding:20px 28px 35px;
}

/* SUMMARY */
.summary-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:10px;
}
.summary-card{
    background:linear-gradient(180deg,#0b1b30,#08172a);
    border:1px solid #173452;
    border-radius:11px;
    padding:14px;
    min-height:105px;
    box-shadow:var(--shadow);
}
.summary-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#91a5bf;
    font-size:10px;
    font-weight:700;
}
.summary-icon{
    width:28px;height:28px;
    border-radius:8px;
    display:grid;place-items:center;
    background:#112e50;
    color:#54b5ff;
    font-size:13px;
}
.summary-value{
    margin-top:9px;
    font-size:24px;
    line-height:1;
    font-weight:850;
}
.summary-sub{
    margin-top:7px;
    color:#6e879f;
    font-size:9px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1.45fr .95fr;
    gap:10px;
    margin-top:10px;
}
.grid-wide{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}
.card{
    background:linear-gradient(180deg,rgba(9,26,46,.96),rgba(7,20,35,.96));
    border:1px solid #173653;
    border-radius:11px;
    box-shadow:var(--shadow);
    padding:14px;
    min-width:0;
}
.card-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:11px;
}
.card-title{
    font-size:12px;
    font-weight:800;
}
.card-sub{
    color:#7187a1;
    font-size:9px;
    margin-top:3px;
}
.chart-box{
    height:250px;
    position:relative;
}
.chart-box.small{height:225px}
.chart-box.tiny{height:185px}

/* QUALITY */
.quality-wrap{
    min-height:225px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
}
.gauge{
    width:154px;height:154px;border-radius:50%;
    position:relative;
    display:grid;
    place-items:center;
    background:conic-gradient(var(--green) 0%,#1a2d45 0);
}
.gauge::after{
    content:"";
    width:110px;height:110px;
    position:absolute;
    border-radius:50%;
    background:#09192b;
}
.gauge-center{
    position:relative;
    z-index:1;
    text-align:center;
}
.gauge-score{
    font-size:28px;
    font-weight:850;
}
.gauge-caption{
    color:#738da8;
    font-size:9px;
    margin-top:3px;
}
.quality-legend{
    display:grid;
    gap:10px;
    font-size:10px;
    color:#9caec3;
}
.quality-line{
    display:flex;align-items:center;gap:7px
}
.quality-dot{
    width:8px;height:8px;border-radius:50%
}

/* HEATMAP */
.heatmap{
    display:grid;
    gap:3px;
    overflow:auto;
    max-height:260px;
}
.heat-row{display:flex;gap:3px}
.heat-cell{
    width:62px;min-width:62px;height:36px;
    border-radius:4px;
    display:grid;
    place-items:center;
    font-size:9px;
    color:white;
}
.heat-label{
    width:100px;min-width:100px;height:36px;
    display:flex;
    align-items:center;
    padding-right:8px;
    color:#7e96af;
    font-size:9px;
    overflow:hidden;
}

/* INSIGHTS */
.insights{display:grid;gap:7px}
.insight{
    border:1px solid #173452;
    border-radius:8px;
    background:#0a1930;
    padding:9px 10px;
    color:#afbdd0;
    line-height:1.45;
    font-size:10px;
}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{
    border:1px solid #1a3b5b;
    background:#0a1f36;
    color:#a1b9d1;
    padding:6px 8px;
    border-radius:16px;
    font-size:9px;
}

/* UPLOAD */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:80;
    background:rgba(2,9,18,.73);
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal.show{display:flex}
.modal-card{
    width:min(520px,95vw);
    border:1px solid #20486b;
    border-radius:13px;
    background:linear-gradient(180deg,#0c2038,#08172a);
    padding:17px;
    box-shadow:0 28px 80px rgba(0,0,0,.42);
}
.modal-title{
    font-weight:800;font-size:16px;
}
.modal-sub{font-size:10px;color:#768fa8;margin-top:4px}
.dropzone{
    margin-top:14px;
    padding:32px 15px;
    text-align:center;
    border:1.5px dashed #2d5478;
    border-radius:10px;
    background:#08182b;
}
.dropzone.drag{
    border-color:#20c5ff;
    background:#0c2037;
}
.drop-icon{font-size:30px}
.drop-title{font-size:12px;font-weight:800;margin-top:7px}
.drop-sub{font-size:9px;color:#7089a1;margin-top:4px}
.file-input{display:none}
.selected{
    min-height:15px;
    margin-top:10px;
    font-size:9px;
    color:#9fb3c9;
}
.modal-actions{
    margin-top:12px;
    display:flex;
    justify-content:flex-end;
    gap:7px;
}
.status{
    min-height:15px;
    margin-top:7px;
    font-size:10px;
    color:#8ba2bb;
}

.empty{
    min-height:280px;
    display:grid;
    place-items:center;
    text-align:center;
    color:#7d93aa;
    padding:40px;
}
.empty-title{font-size:17px;color:#fff;font-weight:800}
.empty-sub{font-size:11px;margin-top:7px}

.toast{
    display:none;
    position:fixed;
    z-index:100;
    right:20px;bottom:20px;
    background:#0d2944;
    border:1px solid #2b5a7e;
    color:#d9ebff;
    border-radius:8px;
    padding:10px 12px;
    font-size:10px;
    box-shadow:var(--shadow);
}
.loading{opacity:.55;pointer-events:none}

/* RESPONSIVE */
@media(max-width:1180px){
    .summary-grid{grid-template-columns:repeat(3,1fr)}
    .grid,.grid-wide{grid-template-columns:1fr}
}
@media(max-width:780px){
    .sidebar{width:68px}
    .brand-text,.nav-title,.nav-label,.user-info,.logout{display:none}
    .brand{justify-content:center;padding:0}
    .nav-btn{justify-content:center;padding:12px 7px}
    .user-card{padding:7px}
    .main{margin-left:68px;width:calc(100% - 68px)}
    .topbar{padding:0 14px}
    .content{padding:14px}
    .summary-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark">📊</div>
        <div class="brand-text">Zaki AI Analytics</div>
    </div>

    <nav class="nav">
        <div class="nav-title">Workspace</div>
        <button class="nav-btn active" onclick="goTop()">
            <span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-btn" onclick="refreshDashboard()">
            <span class="nav-icon">📁</span><span class="nav-label">My Analyses</span>
        </button>
        <button class="nav-btn" onclick="openUpload()">
            <span class="nav-icon">📤</span><span class="nav-label">Upload Data</span>
        </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="user-card">
        <div class="user-row">
            <div class="avatar" id="avatar">U</div>
            <div class="user-info">
                <div class="user-name" id="userName">Loading...</div>
                <div class="user-email" id="userEmail"></div>
            </div>
        </div>
        <button class="logout" onclick="logout()">🚪 Logout</button>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <div>
            <div class="page-title">Analytics Dashboard</div>
            <div class="page-subtitle" id="datasetTitle">Loading your latest analysis...</div>
        </div>
        <div class="top-actions">
            <button class="btn" onclick="refreshDashboard()">↻ Refresh</button>
            <button class="btn primary" onclick="openUpload()">📤 Upload Data</button>
        </div>
    </header>

    <div class="content">
        <section id="dashboardArea">
            <div class="card empty">
                <div>
                    <div class="empty-title">Loading dashboard...</div>
                    <div class="empty-sub">Fetching your latest analysis.</div>
                </div>
            </div>
        </section>
    </div>
</main>
</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
    <div class="modal-card">
        <div class="modal-title">Upload New Dataset</div>
        <div class="modal-sub">CSV, XLSX or XLS • Maximum 100MB</div>

        <div class="dropzone" id="dropzone">
            <div class="drop-icon">☁️</div>
            <div class="drop-title">Drag & drop your file here</div>
            <div class="drop-sub">or choose a file from your computer</div>
            <label class="btn" style="display:inline-block;margin-top:12px" for="fileInput">Choose File</label>
            <input id="fileInput" class="file-input" type="file" accept=".csv,.xlsx,.xls">
            <div class="selected" id="selectedFile">No file selected</div>
        </div>

        <div class="modal-actions">
            <button class="btn" onclick="closeUpload()">Cancel</button>
            <button class="btn primary" id="uploadBtn" onclick="uploadNewFile()" disabled>Upload & Analyze</button>
        </div>
        <div class="status" id="uploadStatus"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentAnalysis = null;
let board = null;
let charts = [];

const $ = id => document.getElementById(id);

async function api(url, options={}) {
    const opts = {...options, credentials:'include'};
    opts.headers = {...(options.headers || {}), Accept:'application/json'};
    const response = await fetch(url, opts);

    if(response.status === 401){
        window.location.replace('/login');
        return null;
    }
    return response;
}

function esc(v){
    return String(v ?? '').replace(/[&<>"']/g,c=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[c]));
}

function number(v,digits=0){
    const n=Number(v);
    return Number.isFinite(n)
        ? n.toLocaleString(undefined,{maximumFractionDigits:digits})
        : '—';
}

function toast(msg){
    const t=$('toast');
    t.textContent=msg;
    t.style.display='block';
    clearTimeout(window.__toast);
    window.__toast=setTimeout(()=>t.style.display='none',3000);
}

function destroyCharts(){
    charts.forEach(c=>{try{c.destroy()}catch(e){}});
    charts=[];
}

function goTop(){
    window.scrollTo({top:0,behavior:'smooth'});
}

async function loadUser(){
    const response=await api('/api/auth/me');
    if(!response || !response.ok)return;
    const user=await response.json();
    const name=[user.first_name,user.last_name].filter(Boolean).join(' ') || user.username || 'User';

    $('userName').textContent=name;
    $('userEmail').textContent=user.email || '';
    $('avatar').textContent=name.charAt(0).toUpperCase();
}

async function loadLatestAnalysis(){
    const listResponse=await api('/api/analyses?page=1');

    if(!listResponse || !listResponse.ok){
        throw new Error('Could not load analyses.');
    }

    const list=await listResponse.json();
    const analyses=list.analyses || [];

    if(!analyses.length){
        currentAnalysis=null;
        board=null;
        renderEmpty();
        return;
    }

    const id=analyses[0].id || analyses[0].analysis_id;

    const detailResponse=await api('/api/analyses/'+id);
    if(!detailResponse || !detailResponse.ok){
        throw new Error('Could not load analysis details.');
    }

    const detail=await detailResponse.json();
    currentAnalysis=detail.analysis || detail;

    /* Preferred HR/BI endpoint from the upgraded backend. */
    try{
        const boardResponse=await api('/api/analyses/'+id+'/dashboard');
        if(boardResponse && boardResponse.ok){
            const result=await boardResponse.json();
            board=result.dashboard || {};
        }else{
            board=null;
        }
    }catch(e){
        board=null;
    }

    renderDashboard();
}

function renderEmpty(){
    destroyCharts();
    $('datasetTitle').textContent='No analysis found. Upload a CSV or Excel file first.';

    $('dashboardArea').innerHTML=`
        <div class="card empty">
            <div>
                <div style="font-size:36px">📊</div>
                <div class="empty-title">No analysis found</div>
                <div class="empty-sub">Upload a CSV or Excel dataset to build your dashboard.</div>
                <button class="btn primary" style="margin-top:13px" onclick="openUpload()">📤 Upload Data</button>
            </div>
        </div>
    `;
}

function renderDashboard(){
    destroyCharts();

    const a=currentAnalysis || {};
    const d=board || {};

    const stats=a.statistics || {};
    const types=a.data_types || {};
    const anomalies=a.anomalies || {};
    const correlations=a.correlations || {};
    const insights=Array.isArray(a.insights) ? a.insights : [];

    const numericColumns=Object.keys(stats);
    const allColumns=a.column_names || Object.keys(types);
    const quality=Math.max(0,Math.min(100,Number(a.quality_score ?? 0)));
    const anomalyCount=Object.values(anomalies)
        .reduce((s,x)=>s+Number(x?.count || 0),0);

    $('datasetTitle').textContent=
        `${a.filename || 'Dataset'} • ${number(a.rows,0)} rows • ${number(a.columns,0)} columns`;

    if(d.is_hr){
        renderHRDashboard(a,d,stats,types,quality,insights,anomalyCount,numericColumns,allColumns);
        return;
    }

    renderGenericDashboard(
        a,d,stats,types,quality,insights,anomalyCount,numericColumns,allColumns,correlations,anomalies
    );
}

function renderHRDashboard(a,d,stats,types,quality,insights,anomalyCount,numericColumns,allColumns){
    const employees=Number(d.employee_count || a.rows || 0);
    const attrition=Number(d.attrition_count || 0);
    const attritionRate=Number(d.attrition_rate || 0);
    const active=Number(d.active_employees || 0);
    const categoricalCount=Number(d.categorical_count || 0);

    $('dashboardArea').innerHTML=`
        <section class="summary-grid">
            <div class="summary-card"><div class="summary-head"><span>Employee Count</span><span class="summary-icon">👥</span></div><div class="summary-value">${number(employees)}</div><div class="summary-sub">Total records / headcount</div></div>
            <div class="summary-card"><div class="summary-head"><span>Attrition Count</span><span class="summary-icon">↘</span></div><div class="summary-value">${number(attrition)}</div><div class="summary-sub">Detected attrition</div></div>
            <div class="summary-card"><div class="summary-head"><span>Attrition Rate</span><span class="summary-icon">%</span></div><div class="summary-value">${number(attritionRate,2)}%</div><div class="summary-sub">Attrition ÷ employee count</div></div>
            <div class="summary-card"><div class="summary-head"><span>Active Employees</span><span class="summary-icon">✓</span></div><div class="summary-value">${number(active)}</div><div class="summary-sub">Estimated active count</div></div>
            <div class="summary-card"><div class="summary-head"><span>Data Quality</span><span class="summary-icon">◎</span></div><div class="summary-value">${number(quality,1)}%</div><div class="summary-sub">${numericColumns.length} numeric • ${categoricalCount} categorical</div></div>
        </section>

        <section class="grid">
            <div class="card"><div class="card-head"><div><div class="card-title">Department-wise Attrition</div><div class="card-sub">Distribution of attrition across departments</div></div></div><div class="chart-box"><canvas id="departmentChart"></canvas></div></div>
            <div class="card"><div class="card-head"><div><div class="card-title">Employees by Age Group</div><div class="card-sub">Headcount distribution by age band</div></div></div><div class="chart-box"><canvas id="ageChart"></canvas></div></div>
        </section>

        <section class="grid-wide">
            <div class="card"><div class="card-head"><div><div class="card-title">Job Satisfaction Rating</div><div class="card-sub">Employee count and attrition rate by rating</div></div></div><div id="satisfactionTable"></div></div>
            <div class="card"><div class="card-head"><div><div class="card-title">Education Field-wise Attrition</div><div class="card-sub">Category-wise attrition summary</div></div></div><div class="chart-box small"><canvas id="educationChart"></canvas></div></div>
        </section>

        <section class="grid-wide">
            <div class="card"><div class="card-head"><div><div class="card-title">Attrition by Gender & Age Group</div><div class="card-sub">Compact demographic comparison</div></div></div><div id="genderAge"></div></div>
            <div class="card"><div class="card-head"><div><div class="card-title">Data Quality</div><div class="card-sub">Completeness and duplicate checks</div></div></div><div class="quality-wrap"><div class="gauge" id="qualityGauge"><div class="gauge-center"><div class="gauge-score">${number(quality,1)}%</div><div class="gauge-caption">QUALITY</div></div></div><div class="quality-legend"><div class="quality-line"><span class="quality-dot" style="background:var(--green)"></span>Good data</div><div class="quality-line"><span class="quality-dot" style="background:var(--yellow)"></span>Review needed</div><div class="quality-line"><span class="quality-dot" style="background:var(--red)"></span>Needs attention</div></div></div></div>
        </section>

        <section class="grid-wide">
            <div class="card"><div class="card-head"><div><div class="card-title">Numeric Overview</div><div class="card-sub">Mean and range of numeric fields</div></div></div><div class="chart-box small"><canvas id="numericChart"></canvas></div></div>

function renderHeatmap(corr){
    const box=$('heatmap');
    const labels=Object.keys(corr || {});

    if(labels.length<2){
        box.innerHTML='<div class="empty" style="min-height:205px">At least two numeric columns are required.</div>';
        return;
    }

    const color=v=>{
        const x=Math.max(-1,Math.min(1,Number(v)||0));
        const hue=x>=0?205:345;
        const light=28+Math.abs(x)*22;
        return `hsl(${hue} 70% ${light}%)`;
    };

    let html='<div class="heatmap">';
    html+=`<div class="heat-row"><div class="heat-label"></div>${labels.map(x=>`<div class="heat-cell" style="background:#11283f">${esc(x)}</div>`).join('')}</div>`;

    labels.forEach(row=>{
        html+=`<div class="heat-row"><div class="heat-label">${esc(row)}</div>`;
        labels.forEach(col=>{
            const value=Number(corr[row]?.[col]);
            html+=`<div class="heat-cell" style="background:${color(value)}">${Number.isFinite(value)?value.toFixed(2):'—'}</div>`;
        });
        html+='</div>';
    });

    html+='</div>';
    box.innerHTML=html;
}

/* upload */
function openUpload(){
    $('uploadModal').classList.add('show');
}
function closeUpload(){
    $('uploadModal').classList.remove('show');
    resetUpload();
}
function resetUpload(){
    $('fileInput').value='';
    $('selectedFile').textContent='No file selected';
    $('uploadStatus').textContent='';
    $('uploadBtn').disabled=true;
    $('uploadBtn').textContent='Upload & Analyze';
}
function selectFile(file){
    $('selectedFile').textContent=`${file.name} • ${(file.size/1024/1024).toFixed(2)} MB`;
    $('uploadBtn').disabled=false;
    $('uploadStatus').textContent='';
}
$('fileInput').addEventListener('change',e=>{
    if(e.target.files[0])selectFile(e.target.files[0]);
});

const drop=$('dropzone');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{
    e.preventDefault();
    drop.classList.remove('drag');

    const file=e.dataTransfer.files[0];
    if(!file)return;

    if(!/\.(csv|xlsx|xls)$/i.test(file.name)){
        $('uploadStatus').textContent='❌ Only CSV, XLSX and XLS files are supported.';
        return;
    }

    try{
        const dt=new DataTransfer();
        dt.items.add(file);
        $('fileInput').files=dt.files;
        selectFile(file);
    }catch(err){
        $('uploadStatus').textContent='Please use Choose File.';
    }
});

async function uploadNewFile(){
    const file=$('fileInput').files[0];
    if(!file){
        $('uploadStatus').textContent='❌ Please choose a file first.';
        return;
    }

    const btn=$('uploadBtn');
    btn.disabled=true;
    btn.textContent='Uploading...';
    $('uploadStatus').textContent='Uploading and analyzing dataset...';

    try{
        const fd=new FormData();
        fd.append('file',file);

        const response=await api('/api/upload',{
            method:'POST',
            body:fd
        });

        if(!response)return;

        let data={};
        try{data=await response.json()}catch(e){}

        if(!response.ok){
            throw new Error(data.error || data.message || 'Upload failed.');
        }

        const uploaded=data.analysis || data;
        const id=uploaded.id || uploaded.analysis_id;

        if(!id){
            throw new Error('Upload succeeded but no analysis ID was returned.');
        }

        $('uploadStatus').textContent='✓ Upload complete. Loading dashboard...';
        closeUpload();

        /* Directly load selected newly uploaded analysis. */
        const detail=await api('/api/analyses/'+id);
        if(!detail || !detail.ok){
            throw new Error('Could not load the uploaded analysis.');
        }

        const detailJson=await detail.json();
        currentAnalysis=detailJson.analysis || detailJson;

        board=null;
        try{
            const boardResponse=await api('/api/analyses/'+id+'/dashboard');
            if(boardResponse && boardResponse.ok){
                const boardJson=await boardResponse.json();
                board=boardJson.dashboard || {};
            }
        }catch(e){}

        renderDashboard();
        toast('Dataset uploaded successfully.');
        window.scrollTo({top:0,behavior:'smooth'});

    }catch(error){
        console.error(error);
        $('uploadStatus').textContent='❌ '+error.message;
        btn.disabled=false;
        btn.textContent='Upload & Analyze';
    }
}

async function refreshDashboard(){
    try{
        document.body.classList.add('loading');
        await loadLatestAnalysis();
        toast('Dashboard refreshed.');
    }catch(error){
        console.error(error);
        toast(error.message);
    }finally{
        document.body.classList.remove('loading');
    }
}

async function logout(){
    try{
        await api('/api/auth/logout',{method:'POST'});
    }finally{
        window.location.replace('/login');
    }
}
