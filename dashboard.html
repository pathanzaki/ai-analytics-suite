<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(100, 200, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(200, 100, 255, 0.1) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 20px;
            perspective: 1200px;
        }

        /* 3D HEADER */
        .header-3d {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 50px;
            transform: translateZ(50px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            animation: slideInDown 0.8s ease;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(50px);
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .header-text h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .header-text p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-3d {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateZ(20px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-3d:hover {
            background: rgba(102, 126, 234, 0.5);
            transform: translateZ(40px) translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-3d.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .btn-3d.primary:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.6);
        }

        /* 3D STATS GRID */
        .stats-3d-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
            perspective: 1200px;
        }

        .stat-3d-card {
            position: relative;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            animation: slideUp 0.8s ease;
            cursor: pointer;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        .stat-3d-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .stat-3d-card:hover {
            transform: translateY(-20px) translateZ(60px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.1);
        }

        .stat-3d-content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-3d-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-3d-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-3d-icon {
            font-size: 24px;
            filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.3));
        }

        .stat-3d-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }

        .stat-3d-change {
            font-size: 11px;
            color: rgba(102, 200, 150, 0.8);
        }

        /* 3D CHARTS GRID */
        .charts-3d-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .chart-3d-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            transform: translateZ(40px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            transition: all 0.5s ease;
            animation: fadeInUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(40px);
            }
        }

        .chart-3d-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .chart-3d-card:hover {
            transform: translateZ(60px) translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            background: rgba(102, 126, 234, 0.1);
        }

        .chart-3d-card.full {
            grid-column: 1 / -1;
        }

        .chart-3d-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-3d-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chart-3d-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .chart-3d-container {
            position: relative;
            height: 300px;
            margin-bottom: 10px;
        }

        .chart-3d-container.small {
            height: 250px;
        }

        /* 3D TABLE */
        .table-3d-wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 50px;
            transform: translateZ(40px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            animation: fadeInUp 1s ease;
        }

        .table-3d-header {
            padding: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table-3d-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .table-3d-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(102, 126, 234, 0.1);
        }

        th {
            padding: 15px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 15px 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }

        /* 3D INSIGHTS */
        .insights-3d-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .insight-3d-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            transform: translateZ(30px);
            transition: all 0.5s ease;
            animation: slideUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .insight-3d-card::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
            transition: all 0.5s ease;
        }

        .insight-3d-card:hover {
            transform: translateZ(50px) translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
        }

        .insight-3d-card:hover::before {
            top: 50%;
            left: 50%;
        }

        .insight-3d-content {
            position: relative;
            z-index: 1;
        }

        .insight-3d-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(102, 126, 234, 0.3));
        }

        .insight-3d-text {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 3D MODAL */
        .modal-3d {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-3d.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-3d-card {
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: translateZ(100px) scale(1);
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: translateZ(0) scale(0.9); opacity: 0; }
            to { transform: translateZ(100px) scale(1); opacity: 1; }
        }

        .modal-3d-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .modal-3d-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
        }

        .dropzone-3d {
            border: 2px dashed rgba(102, 126, 234, 0.5);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: rgba(102, 126, 234, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .dropzone-3d:hover, .dropzone-3d.drag {
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(102, 126, 234, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .drop-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .drop-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 5px;
        }

        .drop-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .file-input {
            display: none;
        }

        .selected-file {
            min-height: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
            padding: 10px;
            background: rgba(102, 200, 150, 0.1);
            border-radius: 8px;
            border-left: 3px solid rgba(102, 200, 150, 0.5);
        }

        .modal-3d-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .status-3d-message {
            min-height: 20px;
            font-size: 11px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* EMPTY STATE */
        .empty-3d-state {
            text-align: center;
            padding: 80px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transform: translateZ(40px);
            animation: fadeInUp 0.8s ease;
        }

        .empty-3d-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .empty-3d-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-3d-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto 30px;
        }

        /* TOAST */
        .toast-3d {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9));
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            display: none;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideInRight 0.3s ease;
        }

        .toast-3d.show {
            display: block;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* SCROLL EFFECTS */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-text h1 {
                font-size: 32px;
            }

            .charts-3d-grid {
                grid-template-columns: 1fr;
            }

            .stat-3d-card {
                height: 160px;
            }

            .chart-3d-container {
                height: 250px;
            }

            .container {
                padding: 20px 15px;
            }

            .modal-3d-card {
                padding: 25px;
            }

            .toast-3d {
                bottom: 15px;
                right: 15px;
                padding: 12px 20px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 3D HEADER -->
        <div class="header-3d">
            <div class="header-content">
                <div class="header-text">
                    <h1>📊 3D Analytics</h1>
                    <p id="datasetInfo">Loading your analysis...</p>
                </div>
                <div class="header-actions">
                    <button class="btn-3d" onclick="refreshDashboard()">↻ Refresh</button>
                    <button class="btn-3d primary" onclick="openUpload()">📤 Upload</button>
                </div>
            </div>
        </div>

        <!-- 3D STATS GRID -->
        <div class="stats-3d-grid" id="statsGrid"></div>

        <!-- 3D CHARTS -->
        <div id="dashboardContent"></div>

        <!-- 3D MODAL -->
        <div class="modal-3d" id="uploadModal">
            <div class="modal-3d-card">
                <div class="modal-3d-title">📤 Upload Dataset</div>
                <div class="modal-3d-subtitle">Upload CSV, XLSX or XLS files (Max 100MB)</div>

                <div class="dropzone-3d" id="dropzone">
                    <div class="drop-icon">☁️</div>
                    <div class="drop-title">Drag & drop your file</div>
                    <div class="drop-subtitle">or click to browse</div>
                    <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xls">
                    <div class="selected-file" id="selectedFile"></div>
                </div>

                <div class="modal-3d-actions">
                    <button class="btn-3d" onclick="closeUpload()">Cancel</button>
                    <button class="btn-3d primary" id="uploadBtn" onclick="uploadFile()" disabled>Upload & Analyze</button>
                </div>
                <div class="status-3d-message" id="uploadStatus"></div>
            </div>
        </div>
    </div>

    <div class="toast-3d" id="toast"></div>

    <script>
        let currentAnalysis = null;
        let charts = [];

        const $ = id => document.getElementById(id);

        async function api(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                credentials: 'include'
            });

            if (response.status === 401) {
                window.location.replace('/login');
                return null;
            }

            return response;
        }

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[c]));
        }

        function fmt(n, d = 0) {
            const v = Number(n);
            return Number.isFinite(v) ? v.toLocaleString(undefined, { maximumFractionDigits: d }) : '—';
        }

        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function destroyCharts() {
            charts.forEach(c => {
                try { c.destroy(); } catch (e) {}
            });
            charts = [];
        }

        async function loadAnalysis() {
            try {
                const res = await api('/api/analyses?page=1');
                if (!res || !res.ok) throw new Error('Could not load analyses');

                const data = await res.json();
                const list = data.analyses || [];

                if (!list.length) {
                    renderEmpty();
                    return;
                }

                const id = list[0].id;
                const detailRes = await api(`/api/analyses/${id}`);
                if (!detailRes || !detailRes.ok) throw new Error('Could not load analysis');

                currentAnalysis = await detailRes.json();
                const a = currentAnalysis.analysis || currentAnalysis;

                $('datasetInfo').textContent = `${a.filename} • ${fmt(a.rows)} rows • ${fmt(a.columns)} columns`;

                renderDashboard();
            } catch (error) {
                console.error(error);
                toast(error.message);
            }
        }

        function renderDashboard() {
            destroyCharts();

            const a = currentAnalysis.analysis || currentAnalysis;
            const stats = a.statistics || {};
            const insights = a.insights || [];
            const quality = Math.min(100, Math.max(0, a.quality_score || 0));
            const columns = a.column_names || [];
            const numCols = Object.keys(stats);

            // Render Stats Cards
            const statsHTML = `
                <div class="stat-3d-card">
                    <div class="stat-3d-content">
                        <div class="stat-3d-header">
                            <div class="stat-3d-label">Total Rows</div>
                            <div class="stat-3d-icon">▤</div>
                        </div>
                        <div class="stat-3d-value">${fmt(a.rows)}</div>
                        <div class="stat-3d-change">📈 Records analyzed</div>
                    </div>
                </div>
                <div class="stat-3d-card">
                    <div class="stat-3d-content">
                        <div class="stat-3d-header">
                            <div class="stat-3d-label">Total Columns</div>
                            <div class="stat-3d-icon">▦</div>
                        </div>
                        <div class="stat-3d-value">${fmt(a.columns)}</div>
                        <div class="stat-3d-change">📊 Fields detected</div>
                    </div>
                </div>
                <div class="stat-3d-card">
                    <div class="stat-3d-content">
                        <div class="stat-3d-header">
                            <div class="stat-3d-label">Numeric Fields</div>
                            <div class="stat-3d-icon">123</div>
                        </div>
                        <div class="stat-3d-value">${fmt(numCols.length)}</div>
                        <div class="stat-3d-change">🔢 Quantitative</div>
                    </div>
                </div>
                <div class="stat-3d-card">
                    <div class="stat-3d-content">
                        <div class="stat-3d-header">
                            <div class="stat-3d-label">Quality Score</div>
                            <div class="stat-3d-icon">◎</div>
                        </div>
                        <div class="stat-3d-value">${fmt(quality, 1)}%</div>
                        <div class="stat-3d-change">✓ Data integrity</div>
                    </div>
                </div>
            `;

            $('statsGrid').innerHTML = statsHTML;

            // Render Charts
            const chartsHTML = `
                <div class="charts-3d-grid">
                    <div class="chart-3d-card">
                        <div class="chart-3d-header">
                            <div class="chart-3d-title">📈 Numeric Summary</div>
                            <div class="chart-3d-subtitle">Mean values across all numeric columns</div>
                        </div>
                        <div class="chart-3d-container">
                            <canvas id="numericChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-3d-card">
                        <div class="chart-3d-header">
                            <div class="chart-3d-title">🎯 Data Distribution</div>
                            <div class="chart-3d-subtitle">Columns by type</div>
                        </div>
                        <div class="chart-3d-container small">
                            <canvas id="typeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="charts-3d-grid">
                    <div class="chart-3d-card full">
                        <div class="chart-3d-header">
                            <div class="chart-3d-title">🔗 Correlation Matrix</div>
                            <div class="chart-3d-subtitle">Relationship between numeric fields</div>
                        </div>
                        <div id="correlationMatrix" style="overflow-x: auto; margin-top: 15px;"></div>
                    </div>
                </div>

                <div class="insights-3d-grid">
                    ${(insights.length ? insights : ['Dataset successfully analyzed']).map((insight, i) => `
                        <div class="insight-3d-card">
                            <div class="insight-3d-content">
                                <div class="insight-3d-icon">${['✦', '⚡', '🔍', '💡'][i % 4]}</div>
                                <div class="insight-3d-text">${esc(insight)}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="table-3d-wrapper">
                    <div class="table-3d-header">
                        <div class="table-3d-title">📋 Column Details</div>
                        <div class="table-3d-subtitle">${columns.length} fields detected</div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Column Name</th>
                                <th>Type</th>
                                <th>Statistics</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${columns.slice(0, 20).map(col => {
                                const st = stats[col];
                                return `
                                    <tr>
                                        <td><strong>${esc(col)}</strong></td>
                                        <td>${a.data_types ? esc(String(a.data_types[col]).split('64')[0]) : '—'}</td>
                                        <td>${st ? `Mean: ${fmt(st.mean, 2)} | Min: ${fmt(st.min, 2)} | Max: ${fmt(st.max, 2)}` : 'No stats'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            $('dashboardContent').innerHTML = chartsHTML;

            renderNumericChart(stats, numCols);
            renderTypeChart(a.data_types || {});
            renderCorrelation(a.correlations || {});
        }

        function renderNumericChart(stats, cols) {
            const labels = cols.slice(0, 10);
            const data = labels.map(c => Number(stats[c]?.mean || 0));

            if (!labels.length) return;

            const ctx = $('numericChart');
            if (!ctx) return;

            charts.push(new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Mean',
                        data,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        filler: { propagate: true }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' }
                        },
                        x: {
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' },
                            grid: { display: false }
                        }
                    }
                }
            }));
        }

        function renderTypeChart(types) {
            const numeric = Object.values(types).filter(t => /int|float/.test(String(t))).length;
            const categorical = Object.keys(types).length - numeric;

            const ctx = $('typeChart');
            if (!ctx) return;

            charts.push(new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Numeric', 'Categorical'],
                    datasets: [{
                        data: [numeric, categorical],
                        backgroundColor: ['rgba(102, 126, 234, 0.8)', 'rgba(118, 75, 162, 0.8)'],
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: 'rgba(255, 255, 255, 0.7)', padding: 15 }
                        }
                    }
                }
            }));
        }

        function renderCorrelation(corr) {
            const cols = Object.keys(corr || {});
            if (cols.length < 2) {
                $('correlationMatrix').innerHTML = '<div style="padding: 20px; text-align: center; color: rgba(255, 255, 255, 0.6);">Need at least 2 numeric columns</div>';
                return;
            }

            let html = '<div style="display: grid; gap: 2px;">';
            html += '<div style="display: grid; grid-template-columns: 100px ' + cols.map(() => '60px').join(' ') + '; gap: 2px;">';
            html += '<div style="background: rgba(102, 126, 234, 0.2); padding: 8px; font-weight: 700; font-size: 11px; border-radius: 4px;"></div>';

            cols.forEach(c => {
                html += `<div style="background: rgba(102, 126, 234, 0.2); padding: 8px; font-weight: 700; font-size: 10px; text-align: center; border-radius: 4px;">${esc(c.substring(0, 8))}</div>`;
            });

            cols.forEach(row => {
                html += `<div style="background: rgba(255, 255, 255, 0.05); padding: 8px; font-weight: 600; font-size: 10px; border-radius: 4px;">${esc(row.substring(0, 8))}</div>`;
                cols.forEach(col => {
                    const val = Number(corr[row]?.[col] || 0);
                    const hue = val > 0 ? 180 : 0;
                    const sat = Math.abs(val) * 100;
                    const light = 50 - Math.abs(val) * 15;
                    html += `<div style="background: hsl(${hue}, ${sat}%, ${light}%); color: white; padding: 8px; font-size: 10px; text-align: center; border-radius: 4px; font-weight: 600;${val > 0.5 ? 'box-shadow: 0 0 10px hsla(' + hue + ', 100%, 50%, 0.5);' : ''}">${val.toFixed(2)}</div>`;
                });
            });

            html += '</div></div>';
            $('correlationMatrix').innerHTML = html;
        }

        function renderEmpty() {
            $('statsGrid').innerHTML = '';
            $('dashboardContent').innerHTML = `
                <div class="empty-3d-state">
                    <div class="empty-3d-icon">📁</div>
                    <div class="empty-3d-title">No Data Found</div>
                    <div class="empty-3d-text">Upload your first CSV or Excel file to get started with 3D analytics.</div>
                    <button class="btn-3d primary" onclick="openUpload()">📤 Upload Dataset</button>
                </div>
            `;
        }

        function openUpload() {
            $('uploadModal').classList.add('show');
        }

        function closeUpload() {
            $('uploadModal').classList.remove('show');
            $('fileInput').value = '';
            $('selectedFile').textContent = '';
            $('uploadStatus').textContent = '';
            $('uploadBtn').disabled = true;
        }

        $('fileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                $('selectedFile').textContent = `✓ ${e.target.files[0].name}`;
                $('uploadBtn').disabled = false;
            }
        });

        const drop = $('dropzone');
        drop.addEventListener('click', () => {
            $('fileInput').click();
        });
        drop.addEventListener('dragover', (e) => {
            e.preventDefault();
            drop.classList.add('drag');
        });
        drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
        drop.addEventListener('drop', (e) => {
            e.preventDefault();
            drop.classList.remove('drag');
            const file = e.dataTransfer.files[0];
            if (file && /\.(csv|xlsx|xls)$/i.test(file.name)) {
                const dt = new DataTransfer();
                dt.items.add(file);
                $('fileInput').files = dt.files;
                $('selectedFile').textContent = `✓ ${file.name}`;
                $('uploadBtn').disabled = false;
            }
        });

        async function uploadFile() {
            const file = $('fileInput').files[0];
            if (!file) return;

            $('uploadBtn').disabled = true;
            $('uploadStatus').textContent = 'Uploading...';

            try {
                const fd = new FormData();
                fd.append('file', file);

                const res = await api('/api/upload', {
                    method: 'POST',
                    body: fd
                });

                if (!res || !res.ok) throw new Error('Upload failed');

                const data = await res.json();
                currentAnalysis = data;

                closeUpload();
                await loadAnalysis();
                toast('✨ File uploaded successfully!');
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                $('uploadStatus').textContent = `❌ ${error.message}`;
                $('uploadBtn').disabled = false;
            }
        }

        async function refreshDashboard() {
            document.body.classList.add('loading');
            try {
                await loadAnalysis();
                toast('🔄 Dashboard refreshed!');
            } catch (error) {
                toast('❌ ' + error.message);
            } finally {
                document.body.classList.remove('loading');
            }
        }

        loadAnalysis();
    </script>
</body>
</html>
