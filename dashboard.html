<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header-subtitle {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        /* FILTERS */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .filter-input, select {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .filter-input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .stat-card.blue { border-left-color: #667eea; }
        .stat-card.green { border-left-color: #48bb78; }
        .stat-card.orange { border-left-color: #f6ad55; }
        .stat-card.red { border-left-color: #f56565; }

        .stat-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #222;
            margin-top: 8px;
        }

        .stat-change {
            font-size: 11px;
            margin-top: 8px;
            color: #48bb78;
        }

        .stat-change.negative {
            color: #f56565;
        }

        /* CHARTS GRID */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .chart-card.full {
            grid-column: 1 / -1;
        }

        .chart-header {
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
        }

        .chart-subtitle {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 10px;
        }

        .chart-container.small {
            height: 250px;
        }

        /* TABLE */
        .data-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .table-header {
            padding: 25px;
            border-bottom: 2px solid #f0f0f0;
        }

        .table-title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
        }

        .table-subtitle {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px 20px;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        /* INSIGHTS */
        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .insight-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .insight-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .insight-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .insight-text {
            font-size: 13px;
            line-height: 1.5;
            opacity: 0.95;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }

        .dropzone {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
        }

        .dropzone:hover, .dropzone.drag {
            border-color: #764ba2;
            background: rgba(102, 126, 234, 0.05);
        }

        .drop-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .drop-title {
            font-size: 14px;
            font-weight: 600;
            color: #222;
            margin-bottom: 5px;
        }

        .drop-subtitle {
            font-size: 11px;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .selected-file {
            min-height: 20px;
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .status-message {
            min-height: 20px;
            font-size: 11px;
            margin-top: 10px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }

        .empty-text {
            font-size: 12px;
            color: #999;
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 2000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .chart-container {
                height: 250px;
            }

            .modal-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-top">
                <div>
                    <div class="header-title">📊 Analytics Dashboard</div>
                    <div class="header-subtitle" id="datasetInfo">Loading your analysis...</div>
                </div>
                <div class="header-actions">
                    <button class="btn" onclick="refreshDashboard()">↻ Refresh</button>
                    <button class="btn btn-primary" onclick="openUpload()">📤 Upload Data</button>
                </div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters" id="filterSection" style="display: none;">
            <div class="filter-group">
                <label class="filter-label">Search Column</label>
                <input type="text" class="filter-input" id="searchFilter" placeholder="Type to filter...">
            </div>
            <div class="filter-group">
                <label class="filter-label">Min Value</label>
                <input type="number" class="filter-input" id="minFilter" placeholder="Minimum">
            </div>
            <div class="filter-group">
                <label class="filter-label">Max Value</label>
                <input type="number" class="filter-input" id="maxFilter" placeholder="Maximum">
            </div>
            <div class="filter-group">
                <label class="filter-label">Sort By</label>
                <select id="sortFilter">
                    <option value="">Default</option>
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- CHARTS -->
        <div id="dashboardContent"></div>

        <!-- MODAL -->
        <div class="modal" id="uploadModal">
            <div class="modal-card">
                <div class="modal-title">📤 Upload Dataset</div>
                <div class="modal-subtitle">Upload CSV, XLSX or XLS files (Max 100MB)</div>

                <div class="dropzone" id="dropzone">
                    <div class="drop-icon">☁️</div>
                    <div class="drop-title">Drag & drop your file here</div>
                    <div class="drop-subtitle">or click to browse</div>
                    <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xls">
                    <div class="selected-file" id="selectedFile"></div>
                </div>

                <div class="modal-actions">
                    <button class="btn" onclick="closeUpload()">Cancel</button>
                    <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>Upload & Analyze</button>
                </div>
                <div class="status-message" id="uploadStatus"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentAnalysis = null;
        let charts = [];

        const $ = id => document.getElementById(id);

        // API
        async function api(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                credentials: 'include'
            });

            if (response.status === 401) {
                window.location.replace('/login');
                return null;
            }

            return response;
        }

        // UTILS
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[c]));
        }

        function fmt(n, d = 0) {
            const v = Number(n);
            return Number.isFinite(v) ? v.toLocaleString(undefined, { maximumFractionDigits: d }) : '—';
        }

        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function destroyCharts() {
            charts.forEach(c => {
                try { c.destroy(); } catch (e) {}
            });
            charts = [];
        }

        // LOAD DATA
        async function loadAnalysis() {
            try {
                const res = await api('/api/analyses?page=1');
                if (!res || !res.ok) throw new Error('Could not load analyses');

                const data = await res.json();
                const list = data.analyses || [];

                if (!list.length) {
                    renderEmpty();
                    return;
                }

                const id = list[0].id;
                const detailRes = await api(`/api/analyses/${id}`);
                if (!detailRes || !detailRes.ok) throw new Error('Could not load analysis');

                currentAnalysis = await detailRes.json();
                const a = currentAnalysis.analysis || currentAnalysis;

                $('datasetInfo').textContent = `${a.filename} • ${fmt(a.rows)} rows • ${fmt(a.columns)} columns`;

                renderDashboard();
            } catch (error) {
                console.error(error);
                toast(error.message);
            }
        }

        // RENDER DASHBOARD
        function renderDashboard() {
            destroyCharts();

            const a = currentAnalysis.analysis || currentAnalysis;
            const stats = a.statistics || {};
            const insights = a.insights || [];
            const quality = Math.min(100, Math.max(0, a.quality_score || 0));
            const columns = a.column_names || [];
            const numCols = Object.keys(stats);

            // Stats Cards
            const content = `
                <div class="charts-grid">
                    <div class="chart-card full">
                        <div class="chart-header">
                            <div class="chart-title">📊 Overview</div>
                            <div class="chart-subtitle">Key metrics from your dataset</div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                            <div style="padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-size: 11px; color: #999; text-transform: uppercase; font-weight: 600;">Rows</div>
                                <div style="font-size: 24px; font-weight: 700; color: #667eea; margin-top: 8px;">${fmt(a.rows)}</div>
                            </div>
                            <div style="padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-size: 11px; color: #999; text-transform: uppercase; font-weight: 600;">Columns</div>
                                <div style="font-size: 24px; font-weight: 700; color: #48bb78; margin-top: 8px;">${fmt(a.columns)}</div>
                            </div>
                            <div style="padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-size: 11px; color: #999; text-transform: uppercase; font-weight: 600;">Numeric Fields</div>
                                <div style="font-size: 24px; font-weight: 700; color: #f6ad55; margin-top: 8px;">${fmt(numCols.length)}</div>
                            </div>
                            <div style="padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-size: 11px; color: #999; text-transform: uppercase; font-weight: 600;">Quality Score</div>
                                <div style="font-size: 24px; font-weight: 700; color: #f56565; margin-top: 8px;">${fmt(quality, 1)}%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-card">
                        <div class="chart-header">
                            <div class="chart-title">📈 Numeric Summary</div>
                            <div class="chart-subtitle">Mean values across all numeric columns</div>
                        </div>
                        <div class="chart-container">
                            <canvas id="numericChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-header">
                            <div class="chart-title">🎯 Data Distribution</div>
                            <div class="chart-subtitle">Columns by type</div>
                        </div>
                        <div class="chart-container small">
                            <canvas id="typeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-card full">
                        <div class="chart-header">
                            <div class="chart-title">🔗 Correlation Matrix</div>
                            <div class="chart-subtitle">Relationship between numeric fields</div>
                        </div>
                        <div id="correlationMatrix" style="overflow-x: auto;"></div>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-card full">
                        <div class="chart-header">
                            <div class="chart-title">✨ AI Insights</div>
                            <div class="chart-subtitle">Automatically generated analysis</div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                            ${(insights.length ? insights : ['No specific insights generated']).map((insight, i) => `
                                <div style="padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #667eea;">
                                    <div style="font-size: 12px; line-height: 1.6; color: #333;">✦ ${esc(insight)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="data-table">
                    <div class="table-header">
                        <div class="table-title">📋 Column Details</div>
                        <div class="table-subtitle">${columns.length} fields detected</div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Column Name</th>
                                <th>Type</th>
                                <th>Stats</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${columns.slice(0, 20).map(col => {
                                const st = stats[col];
                                return `
                                    <tr>
                                        <td><strong>${esc(col)}</strong></td>
                                        <td>${a.data_types ? esc(String(a.data_types[col]).split('64')[0]) : '—'}</td>
                                        <td>${st ? `Mean: ${fmt(st.mean, 2)} | Min: ${fmt(st.min, 2)} | Max: ${fmt(st.max, 2)}` : 'No stats'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            $('dashboardContent').innerHTML = content;

            // Render Charts
            renderNumericChart(stats, numCols);
            renderTypeChart(a.data_types || {});
            renderCorrelation(a.correlations || {});
        }

        function renderNumericChart(stats, cols) {
            const labels = cols.slice(0, 10);
            const data = labels.map(c => Number(stats[c]?.mean || 0));

            if (!labels.length) return;

            const ctx = $('numericChart');
            if (!ctx) return;

            charts.push(new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Mean',
                        data,
                        backgroundColor: '#667eea',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f0f0f0' } }
                    }
                }
            }));
        }

        function renderTypeChart(types) {
            const numeric = Object.values(types).filter(t => /int|float/.test(String(t))).length;
            const categorical = Object.keys(types).length - numeric;

            const ctx = $('typeChart');
            if (!ctx) return;

            charts.push(new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Numeric', 'Categorical'],
                    datasets: [{
                        data: [numeric, categorical],
                        backgroundColor: ['#667eea', '#48bb78'],
                        borderColor: 'white',
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            }));
        }

        function renderCorrelation(corr) {
            const cols = Object.keys(corr || {});
            if (cols.length < 2) {
                $('correlationMatrix').innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Need at least 2 numeric columns</div>';
                return;
            }

            let html = '<div style="display: grid; gap: 2px;">';
            html += '<div style="display: grid; grid-template-columns: 100px ' + cols.map(() => '60px').join(' ') + '; gap: 2px;">';
            html += '<div style="background: #f0f0f0; padding: 8px; font-weight: 700; font-size: 11px;"></div>';

            cols.forEach(c => {
                html += `<div style="background: #f0f0f0; padding: 8px; font-weight: 700; font-size: 10px; text-align: center;">${esc(c.substring(0, 8))}</div>`;
            });

            cols.forEach(row => {
                html += `<div style="background: #f8f9fa; padding: 8px; font-weight: 600; font-size: 10px;">${esc(row.substring(0, 8))}</div>`;
                cols.forEach(col => {
                    const val = Number(corr[row]?.[col] || 0);
                    const hue = val > 0 ? 180 : 0;
                    const sat = Math.abs(val) * 100;
                    const light = 50 - Math.abs(val) * 20;
                    html += `<div style="background: hsl(${hue}, ${sat}%, ${light}%); color: white; padding: 8px; font-size: 10px; text-align: center; border-radius: 4px; font-weight: 600;">${val.toFixed(2)}</div>`;
                });
            });

            html += '</div></div>';
            $('correlationMatrix').innerHTML = html;
        }

        function renderEmpty() {
            $('filterSection').style.display = 'none';
            $('statsGrid').innerHTML = '';
            $('dashboardContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📁</div>
                    <div class="empty-title">No Data Found</div>
                    <div class="empty-text">Upload your first CSV or Excel file to get started with analytics.</div>
                    <button class="btn btn-primary" onclick="openUpload()">📤 Upload Dataset</button>
                </div>
            `;
        }

        // UPLOAD
        function openUpload() {
            $('uploadModal').classList.add('show');
        }

        function closeUpload() {
            $('uploadModal').classList.remove('show');
            $('fileInput').value = '';
            $('selectedFile').textContent = '';
            $('uploadStatus').textContent = '';
            $('uploadBtn').disabled = true;
        }

        $('fileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                $('selectedFile').textContent = `✓ ${e.target.files[0].name}`;
                $('uploadBtn').disabled = false;
            }
        });

        const drop = $('dropzone');
        drop.addEventListener('dragover', (e) => {
            e.preventDefault();
            drop.classList.add('drag');
        });
        drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
        drop.addEventListener('drop', (e) => {
            e.preventDefault();
            drop.classList.remove('drag');
            const file = e.dataTransfer.files[0];
            if (file && /\.(csv|xlsx|xls)$/i.test(file.name)) {
                const dt = new DataTransfer();
                dt.items.add(file);
                $('fileInput').files = dt.files;
                $('selectedFile').textContent = `✓ ${file.name}`;
                $('uploadBtn').disabled = false;
            }
        });

        async function uploadFile() {
            const file = $('fileInput').files[0];
            if (!file) return;

            $('uploadBtn').disabled = true;
            $('uploadStatus').textContent = 'Uploading...';

            try {
                const fd = new FormData();
                fd.append('file', file);

                const res = await api('/api/upload', {
                    method: 'POST',
                    body: fd
                });

                if (!res || !res.ok) throw new Error('Upload failed');

                const data = await res.json();
                currentAnalysis = data;

                closeUpload();
                await loadAnalysis();
                toast('File uploaded successfully!');
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                $('uploadStatus').textContent = `❌ ${error.message}`;
                $('uploadBtn').disabled = false;
            }
        }

        async function refreshDashboard() {
            document.body.classList.add('loading');
            try {
                await loadAnalysis();
                toast('Dashboard refreshed!');
            } catch (error) {
                toast(error.message);
            } finally {
                document.body.classList.remove('loading');
            }
        }

        // INIT
        loadAnalysis();
    </script>
</body>
</html>
