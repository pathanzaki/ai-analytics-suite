<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Analytics Suite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <h1>Welcome Back</h1>
        <div class="subtitle">Login to AI Analytics Suite</div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="/signup">Create Account</a>
        </div>

    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    message.className = "message";
    message.textContent = "";

    if (!username || !password) {
        message.textContent = "Please enter username and password.";
        message.className = "message error";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        console.log("Login response:", data);

        if (response.ok) {

            message.textContent = "Login successful! Redirecting...";
            message.className = "message success";

            // Backend uses Flask session cookie.
            // No token is required here.

            setTimeout(function() {
                window.location.href = "/dashboard";
            }, 500);

        } else {

            message.textContent = data.error || "Invalid username or password.";
            message.className = "message error";

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }

    } catch (error) {

        console.error("Login error:", error);

        message.textContent = "Unable to connect to server.";
        message.className = "message error";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }
});
</script>

</body>
</html>
